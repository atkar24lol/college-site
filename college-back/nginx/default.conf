# nginx внутри docker-compose: проксирует на сервисы web (Django) и frontend (Next.js)
# по их именам в compose-сети. Статика/медиа отдаются с примонтированных томов.
# HTTPS через Let's Encrypt: HTTP (80) только для ACME-челленджа и редиректа на HTTPS (443).

upstream django_backend {
    server web:8000;
}

upstream nextjs_frontend {
    server frontend:3000;
}

# ── HTTP :80 — только ACME-челлендж и редирект на HTTPS ──
server {
    listen 80;
    server_name atk.kg www.atk.kg 178.219.159.94 _;

    # ACME-челлендж Let's Encrypt (certbot webroot) — без редиректа, по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Всё остальное — на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — основной сервер ──
server {
    listen 443 ssl;
    http2 on;
    server_name atk.kg www.atk.kg 178.219.159.94 _;

    ssl_certificate     /etc/letsencrypt/live/atk.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atk.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Медиа Django (том, общий с контейнером web)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Статика Django после collectstatic (том, общий с контейнером web)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # API с языковым префиксом: /ru/api/v1/, /en/api/v1/, /ky/api/v1/
    location ~ ^/(ru|en|ky)/api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / Redoc без языкового префикса (как в urls.py)
    location /api/v1/swagger/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/redoc/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админка Django
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фронтенд Next.js (всё остальное)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
