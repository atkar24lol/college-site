# nginx внутри docker-compose: проксирует на сервисы web (Django) и frontend (Next.js)
# по их именам в compose-сети. Статика/медиа отдаются с примонтированных томов.

upstream django_backend {
    server web:8000;
}

upstream nextjs_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name atk.kg www.atk.kg 178.219.159.94 _;

    client_max_body_size 25M;

    # Медиа Django (том, общий с контейнером web)
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Статика Django после collectstatic (том, общий с контейнером web)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # API с языковым префиксом: /ru/api/v1/, /en/api/v1/, /ky/api/v1/
    location ~ ^/(ru|en|ky)/api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger / Redoc без языкового префикса (как в urls.py)
    location /api/v1/swagger/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/redoc/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Админка Django
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фронтенд Next.js (всё остальное)
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
