services:
  db:
    image: postgres:14
    container_name: postgres_container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Только loopback: БД доступна локально (dev-клиенты), но НЕ из интернета.
    # Внутри compose-сети Django обращается к db по hostname `db` без публикации порта.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - knau_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_container
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
    # Только loopback: на сервере nginx проксирует на 127.0.0.1:8000.
    # Публиковать на 0.0.0.0 нельзя — Docker обходит ufw и откроет порт в интернет.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  knau_db:
