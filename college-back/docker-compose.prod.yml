# Прод / демо на сервере: полный стек в Docker одной командой.
# Запуск (из папки college-back):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Сервисы: nginx (:80) → frontend (Next.js standalone) + web (Django/Gunicorn) + db (Postgres).
# Перед первым запуском заполните college-back/.env (POSTGRES_*, DEBUG=False, ALLOWED_HOSTS,
# CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS, SECRET_KEY; при HTTPS — USE_TLS_BEHIND_PROXY=True).

services:
  db:
    # Автозапуск БД после перезагрузки сервера: без этого стек не поднимется,
    # т.к. web ждёт healthy-postgres (depends_on: service_healthy).
    restart: unless-stopped

  web:
    build:
      # Сборка через сеть хоста: на VPS без IPv6 BuildKit-sandbox иначе пытается
      # ходить по IPv6 и роняет внешние запросы (pip/apt) во время build.
      network: host
    # runserver → gunicorn; collectstatic в общий со nginx том ./static
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    restart: unless-stopped

  frontend:
    build:
      context: ../atk-front
      # Сборка через сеть хоста: на VPS без IPv6 next/font иначе не может
      # скачать шрифты с Google Fonts (BuildKit-sandbox уходит в IPv6 и таймаутит).
      network: host
      args:
        # Относительный API-base: фронт ходит на тот же origin, что отдаёт nginx.
        # Переопределяется через .env (NEXT_PUBLIC_API_BASE / NEXT_PUBLIC_IMAGE_HOSTS).
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/ru/api/v1}
        NEXT_PUBLIC_IMAGE_HOSTS: ${NEXT_PUBLIC_IMAGE_HOSTS:-}
        # Используется как metadataBase для OpenGraph. По умолчанию домен сайта.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://atk.kg}
    container_name: nextjs_container
    restart: unless-stopped
    # Порт не публикуется на хост — nginx достучится по compose-сети (frontend:3000)
    expose:
      - "3000"
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx_container
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Те же каталоги, что монтирует web — статика/медиа отдаются напрямую nginx
      - ./static:/usr/share/nginx/static:ro
      - ./media:/usr/share/nginx/media:ro
      # Let's Encrypt: webroot для ACME-челленджа и сами сертификаты (read-only для nginx).
      # Сертификаты выпускает/продлевает отдельный контейнер certbot с rw-доступом.
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend
