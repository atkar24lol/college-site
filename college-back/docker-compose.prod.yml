# Прод / демо на сервере: Gunicorn вместо runserver.
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Перед первым запуском: заполните college-back/.env (POSTGRES_*, DEBUG=False, ALLOWED_HOSTS, CORS, SECRET_KEY).

services:
  web:
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
